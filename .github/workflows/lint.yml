name: Lint Formula

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: brew audit + forbidden-content check
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      # `brew audit` no longer accepts a file path — "Calling `brew audit [path ...]`
      # is disabled! Use `brew audit [name ...]` instead." The formula therefore has to
      # be reachable as a real tap before it can be audited by name.
      - name: Link this checkout as a tap
        run: |
          TAP_DIR="$(brew --repository)/Library/Taps/bravros/homebrew-tap"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      # Plain audit, not --strict. The formula is regenerated by GoReleaser on every
      # release, and GoReleaser always emits an explicit `version` — which --strict
      # flags as "redundant with version scanned from URL". That rule targets
      # homebrew-core submissions; we cannot satisfy it without hand-editing a
      # generated file that the next release would overwrite. The checks that
      # actually matter here (valid Ruby, resolvable URLs, correct SHAs) all run
      # without --strict, and the forbidden-content rule below is the real gate.
      - name: Audit formula
        run: brew audit --formula bravros/tap/bravros

      - name: Check for forbidden content
        run: |
          if grep -qE '\b(skills|templates|hooks\.json|settings\.json)\b' Formula/bravros.rb; then
            echo "ERROR: Formula contains forbidden content — the tap ships the binary only"
            grep -nE '\b(skills|templates|hooks\.json|settings\.json)\b' Formula/bravros.rb
            exit 1
          fi
          echo "OK: No forbidden content found in formula."
